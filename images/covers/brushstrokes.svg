<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    .stroke path { stroke-dasharray: 1600; stroke-dashoffset: 1600; animation: paint 7s cubic-bezier(.6,.05,.3,1) infinite; }
    .stroke path:nth-child(odd) { animation-delay: .08s; }
    .title { animation: fade 7s ease infinite; }
    @keyframes paint { 0% { stroke-dashoffset: 1600; opacity: 1; } 28%, 86% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes fade { 0%, 12% { opacity: 0; } 30%, 86% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .stroke path, .title { animation: none; stroke-dashoffset: 0; } }
  </style>
  <defs>
    <filter id="brush" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.09" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.10 0"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#EDE4D6"/>
